<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>NeuroMem · 记忆管理</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0A0C12;--bg-2:#0D1017;--surface:#141822;--surface-2:#1A1F2B;
    --line:#262D3C;--line-soft:#1E2331;
    --fg:#E8EBF2;--fg-2:#A7AEC2;--fg-3:#6E768D;
    --acc:#6C8CFF;--acc-soft:rgba(108,140,255,.13);
    --ok:#4FD1A5;--warn:#F2C56B;--danger:#FF7A7A;
    --r:14px;--r-sm:10px;
    --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
    font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
    display:block}
  /* ==== 侧边导航 ==== */
  aside{position:fixed;left:0;top:0;bottom:0;width:244px;z-index:50;
    border-right:1px solid var(--line-soft);background:var(--bg-2);padding:22px 14px 16px;
    display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
  .brand .logo{width:26px;height:26px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,#6C8CFF,#9B8CFF);box-shadow:0 6px 16px rgba(108,140,255,.32)}
  .brand b{font-size:13.5px;letter-spacing:-.01em;display:block}
  .brand small{color:var(--fg-3);font-size:10.5px}
  .nav-label{color:#7C849C;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    padding:14px 10px 5px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
    background:transparent;border:1px solid transparent;color:var(--fg-2);font-size:13px;
    cursor:pointer;text-align:left;width:100%;font-family:inherit;
    transition:background .15s,color .15s,border-color .15s}
  .nav-item svg{width:16px;height:16px;flex:none;opacity:.7}
  .nav-item:hover{background:var(--surface);color:var(--fg)}
  .nav-item.on{background:var(--acc-soft);border-color:rgba(108,140,255,.22);color:#fff}
  .nav-item.on svg{opacity:1}
  .side-foot{margin-top:auto;padding:12px 13px;border:1px solid var(--line-soft);border-radius:12px;
    background:var(--surface);font-size:11.5px;color:var(--fg-3)}
  .side-foot .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .side-foot .row + .row{margin-top:6px}
  .side-foot b{color:var(--fg);font-weight:600;font-size:12.5px}
  /* ==== 主区 ==== */
  .main{min-width:0;margin-left:244px;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
    padding:14px 28px;border-bottom:1px solid var(--line-soft);
    background:rgba(10,12,18,.78);backdrop-filter:blur(14px)}
  .page-title{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .page-sub{font-size:11.5px;color:var(--fg-3);margin-top:1px}
  .topbar .spacer{flex:1}
  .badge{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;
    border:1px solid var(--line);border-radius:999px;background:var(--surface);
    color:var(--fg-2);font-size:11.5px;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
  .content{padding:24px 28px 72px;max-width:1400px;width:100%;margin:0 auto}
  /* ==== 卡片 / KPI ==== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .card .k{color:var(--fg-3);font-size:11.5px;letter-spacing:.02em}
  .card .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:6px;
    font-variant-numeric:tabular-nums}
  .kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  /* 调用记录只增不减：定高内滚，别把下面的模型配置顶出屏幕 */
  .scroll-box{max-height:332px;overflow-y:auto;margin-top:8px;
    border:1px solid var(--line-soft);border-radius:10px}
  .scroll-box table{margin:0}
  .scroll-box thead th{position:sticky;top:0;z-index:1;background:var(--surface);
    padding:9px 10px 7px;box-shadow:inset 0 -1px 0 var(--line-soft)}
  .scroll-box tbody td{padding:8px 10px}
  /* 首次配置引导横幅 */
  .setup-banner{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;margin-bottom:16px;
    border:1px solid rgba(242,197,107,.32);border-radius:var(--r);
    background:linear-gradient(135deg,rgba(242,197,107,.10),rgba(108,140,255,.06))}
  .setup-banner .ico{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:rgba(242,197,107,.16);color:var(--warn);font-size:16px}
  .setup-banner .body{flex:1;min-width:0}
  .setup-banner .body b{display:block;font-size:13.5px;margin-bottom:3px}
  .setup-banner .body p{margin:0;color:var(--fg-2);font-size:12px;line-height:1.65}
  .setup-banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .setup-banner code,.donate-card code{font-family:var(--mono);font-size:11.5px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--fg)}
  /* 支持本项目：二维码占位卡 */
  .donate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
  .donate-card{text-align:center;padding:20px 16px}
  .donate-card .qr{width:160px;height:160px;margin:6px auto 12px;border-radius:12px;
    border:1px dashed var(--line);background:
      repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(255,255,255,.02) 8px,rgba(255,255,255,.02) 16px);
    display:grid;place-items:center;color:var(--fg-3);position:relative;overflow:hidden}
  .donate-card .qr img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
  .donate-card .qr .ph{font-size:11px;line-height:1.6;padding:0 12px}
  .donate-card .qr .ph b{display:block;font-size:12.5px;color:var(--fg-2);margin-bottom:4px}
  .donate-card .t{font-size:13.5px;font-weight:600}
  .donate-card .s{font-size:11.5px;color:var(--fg-3);margin-top:3px}
  /* 开关 */
  .sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    user-select:none;position:relative}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw .track{width:38px;height:21px;border-radius:999px;background:var(--bg-2);
    border:1px solid var(--line);position:relative;flex:none;transition:all .16s}
  .sw .track::after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;
    border-radius:50%;background:var(--fg-3);transition:all .16s}
  .sw input:checked + .track{background:var(--acc-soft);border-color:rgba(108,140,255,.55)}
  .sw input:checked + .track::after{transform:translateX(17px);background:var(--acc)}
  .sw .lbl{font-size:13px;color:var(--fg)}
  .sw .sub{font-size:11.5px;color:var(--fg-3);display:block;margin-top:1px}
  /* ==== 表格 ==== */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--fg-3);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    font-weight:600;text-align:left;padding:0 10px 8px}
  td{padding:11px 10px;border-top:1px solid var(--line-soft);vertical-align:top}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:rgba(255,255,255,.018)}
  .num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px;color:var(--fg-2)}
  /* ==== 控件 ==== */
  input,textarea,select{background:var(--bg-2);color:var(--fg);border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;font-family:inherit;font-size:13px;outline:none;
    transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{border-color:rgba(108,140,255,.55);
    box-shadow:0 0 0 3px rgba(108,140,255,.12)}
  textarea{flex:1;min-width:240px;min-height:40px;resize:vertical;line-height:1.6}
  button.act{height:32px;padding:0 12px;border-radius:8px;background:var(--surface-2);
    border:1px solid var(--line);color:var(--fg-2);cursor:pointer;font-size:12.5px;
    font-family:inherit;transition:all .15s;white-space:nowrap;margin-right:4px}
  button.act:hover{border-color:#3A4159;color:var(--fg)}
  button.act:active{transform:translateY(1px)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#080A10;font-weight:600}
  button.primary:hover{filter:brightness(1.07);color:#080A10}
  button.danger{color:var(--danger);border-color:rgba(255,122,122,.28)}
  button.danger:hover{background:rgba(255,122,122,.08);border-color:rgba(255,122,122,.5)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:12px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .panel label{color:var(--fg-3);font-size:12px}
  .tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;
    background:rgba(255,255,255,.055);color:var(--fg-2)}
  .concept{background:rgba(155,140,255,.14);color:#C3B5FF}
  .pill{display:inline-block;margin:2px 4px 2px 0;padding:3px 10px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2);font-size:11.5px}
  .hint{color:var(--fg-3);font-size:12px}
  /* 向量重建进度 */
  .rb-bar{height:10px;border-radius:6px;background:var(--bg-2);border:1px solid var(--line-soft);overflow:hidden;margin:10px 0 6px}
  .rb-fill{height:100%;width:0;background:linear-gradient(90deg,#3d7dff,#5aa9ff);transition:width .35s ease}
  .rb-fill.err{background:#c0392b}.rb-fill.done{background:#2e9e5b}
  .rb-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--fg-3);font-size:12px}
  /* ==== 图表 / 空态 ==== */
  .chart{height:440px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:6px}
  .empty{padding:44px 20px;text-align:center;color:var(--fg-3);font-size:13px}
  .result{font-family:var(--mono);font-size:12px;color:var(--fg-2);white-space:pre-wrap;
    padding:10px 2px;line-height:1.65}
  /* ==== 对话 ==== */
  .msg{padding:11px 15px;border-radius:12px;margin-bottom:10px;line-height:1.72;
    white-space:pre-wrap;max-width:88%}
  .msg.user{background:var(--acc-soft);border:1px solid rgba(108,140,255,.22);align-self:flex-end}
  .msg.bot{background:var(--surface);border:1px solid var(--line)}
  .chatbox{max-height:460px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0}
  .hit{font-size:12px;color:var(--fg-2);border-left:2px solid var(--line);
    padding:4px 10px;margin:6px 0;line-height:1.6}
  .msg.proactive{background:rgba(108,140,255,.10);border:1px solid rgba(108,140,255,.34);
    align-self:flex-start;max-width:92%}
  .msg.proactive .pflag{display:inline-block;font-size:11px;color:var(--acc);
    border:1px solid rgba(108,140,255,.4);border-radius:20px;padding:1px 8px;margin-right:8px}
  .pc-act{margin-top:9px;display:flex;gap:8px}
  .pc-act button{font-size:12px;padding:4px 12px;border-radius:8px;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);color:var(--fg)}
  .pc-act button:hover{border-color:var(--acc);color:var(--acc)}
  /* ==== 陪伴通道状态条 / 记忆回执 ==== */
  .livebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;
    color:var(--fg-2);background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;margin-bottom:10px}
  .livebar b{color:var(--fg);font-weight:600}
  .livebar .dot{width:7px;height:7px;border-radius:50%;background:var(--fg-2);flex:none}
  .livebar .dot.on{background:#3ec98a}
  .livebar .dot.off{background:#c96b3e}
  .msg .meta{font-size:11px;color:var(--acc);margin-top:6px;opacity:.9}
  .msg .ts{font-size:10px;color:var(--fg-3);opacity:.7;margin-top:5px;
    font-variant-numeric:tabular-nums}
  .msg.user .ts{text-align:right}
  .msg .remember{font-size:12px;color:var(--fg-2);border-left:2px solid rgba(62,201,138,.55);
    padding:4px 10px;margin:6px 0;line-height:1.6}
  .msg.thinking{background:transparent;border:1px dashed var(--line);color:var(--fg-2);
    font-style:italic;align-self:flex-start}
  /* ==== 抽屉 ==== */
  .drawer-mask{position:fixed;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(3px);z-index:90}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(600px,100%);background:var(--surface);
    border-left:1px solid var(--line);padding:24px 26px;overflow:auto;z-index:100;
    box-shadow:-30px 0 80px rgba(0,0,0,.5)}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .drawer h3{font-size:18px;margin:0;letter-spacing:-.015em;font-weight:650}
  .drawer .meta{color:var(--fg-3);font-size:11.5px;margin-top:6px;font-family:var(--mono)}
  .drawer .sec{margin-top:20px}
  .drawer .sec > .label{color:var(--fg-3);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:600}
  .drawer .body-text{margin-top:8px;font-size:14px;line-height:1.85;color:#D9DEEA;white-space:pre-wrap}
  .drawer table{margin-top:10px}
  .drawer th{width:88px;text-transform:none;letter-spacing:0;font-size:12px;padding:7px 10px 7px 0}
  .drawer td{padding:7px 0;font-size:12.5px;border-top:1px solid var(--line-soft)}
  /* ==== 阶段条 ==== */
  .stagebar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
  .stage{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:10px;
    padding:10px;min-height:76px;transition:border-color .15s}
  .stage.done{border-color:rgba(108,140,255,.32);background:rgba(108,140,255,.06)}
  .stage.cur{border-color:rgba(108,140,255,.6);background:var(--acc-soft)}
  .stage .sn{font-size:12.5px;font-weight:600}
  .stage .sv{font-size:11px;color:var(--fg-3);margin-top:5px;line-height:1.5}
  .meter{margin-top:14px}
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;color:var(--fg-2)}
  .meter-top b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:999px;background:var(--bg-2);margin-top:7px;
    overflow:hidden;border:1px solid var(--line-soft)}
  .bar i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,#5B7CFF,#97A6FF)}
  /* ==== 表单 / toast ==== */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .grid2 label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--fg-3)}
  .grid2 input,.grid2 select{width:100%}
  .toast{position:fixed;right:24px;bottom:24px;background:#1D2230;
    border:1px solid rgba(108,140,255,.4);padding:11px 16px;border-radius:10px;
    font-size:12.5px;display:none;z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.4)}
  /* ==== 登录 / 账号 ==== */
  .hidden{display:none!important}
  .auth-overlay{position:fixed;inset:0;background:rgba(6,8,12,.88);
    display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
  .auth-card{width:340px;max-width:100%;background:#14171F;border:1px solid #232733;
    border-radius:14px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:12px}
  .auth-logo{font-size:17px;font-weight:600;letter-spacing:.02em;color:var(--fg)}
  .auth-sub{font-size:12px;color:var(--fg-3);margin-top:-6px}
  .auth-card label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--fg-3)}
  .auth-card input{width:100%}
  .auth-err{color:#FF8080;font-size:11.5px;min-height:15px;line-height:1.5}
  .auth-card .act{justify-content:center}
  /* ==== 人设（L0 后台编辑） ==== */
  .pform{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .pfield{display:flex;flex-direction:column;gap:5px;font-size:11.5px;
    color:var(--fg-3);margin-bottom:11px;min-width:0}
  .pfield input,.pfield textarea{width:100%;font-size:13px}
  .pfield textarea{min-height:52px}
  .pform .wide{grid-column:1 / -1}
  .psec{margin:16px 0 10px;padding-top:12px;border-top:1px solid var(--line-soft);
    color:var(--fg-2);font-size:12px;font-weight:600;letter-spacing:.02em}
  .pkv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
  .pkv div{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
  .pkv span{display:block;color:var(--fg-3);font-size:10.5px}
  .pkv b{font-size:12.5px;font-weight:600;word-break:break-all}
  /* ==== 响应式 ==== */
  @media(max-width:1180px){.ov-grid{grid-template-columns:1fr}}
  @media(max-width:1024px){
    body{display:block}
    aside{position:static;width:auto;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:4px;
      border-right:0;border-bottom:1px solid var(--line-soft);padding:10px 12px;align-items:center}
    .main{margin-left:0}
    .brand{padding:0 10px 0 4px}
    .brand small,.nav-label,.side-foot{display:none}
    #tabs{display:flex;gap:4px;align-items:center}
    .nav-item{width:auto;white-space:nowrap;padding:8px 11px}
    .content{padding:18px 16px 60px}
    .topbar{padding:12px 16px}
  }
  @media(max-width:760px){
    .grid2,.pform{grid-template-columns:1fr}
    .stagebar{grid-template-columns:repeat(3,1fr)}
    .kpi{grid-template-columns:1fr 1fr}
    .ov-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="logo"></div>
    <div><b>NeuroMem</b><small>成长记忆系统</small></div>
  </div>

  <div id="tabs">
    <div class="nav-label">观察</div>
    <button class="nav-item on" data-tab="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
      概览
    </button>
    <button class="nav-item" data-tab="graph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="6.5" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="11" cy="18" r="2.4"/><path d="M8.2 7.1 15.6 7.6M16.7 10.2 12.5 15.6M9.2 16.8 7 8.9"/></svg>
      图谱
    </button>
    <button class="nav-item" data-tab="growth">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5L13 15l7-8"/><path d="M15.5 7H20v4.5"/></svg>
      成长
    </button>

    <div class="nav-label">记录</div>
    <button class="nav-item" data-tab="events">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="M3 12l9 4.5L21 12"/><path d="M3 16.5 12 21l9-4.5"/></svg>
      记忆
    </button>
    <button class="nav-item" data-tab="chat">

<div id="authOverlay" class="auth-overlay hidden">
  <form class="auth-card" onsubmit="return submitAuth(event)">
    <div class="auth-logo" id="authTitle">NeuroMem</div>
    <div class="auth-sub" id="authSub">登录记忆管家</div>
    <label>用户名<input id="authUser" autocomplete="username" required></label>
    <label>密码<input id="authPass" type="password" autocomplete="current-password" required></label>
    <label id="authPass2Wrap" class="hidden">确认密码<input id="authPass2" type="password"></label>
    <div class="auth-err" id="authErr"></div>
    <button class="act primary" type="submit" id="authBtn">登录</button>
  </form>
</div>

<!-- ==== 账号设置 ==== -->
<div id="acctModal" class="auth-overlay hidden">
  <form class="auth-card" onsubmit="return saveAccount(event)">
    <div class="auth-logo">账号设置</div>
    <div class="auth-sub">留空的字段不会修改</div>
    <label>当前密码<input id="acOld" type="password" autocomplete="current-password" required></label>
    <label>新用户名<input id="acUser" placeholder="留空不改"></label>
    <label>新密码<input id="acPass" type="password" placeholder="留空不改（至少 6 位）"></label>
    <div class="auth-err" id="acErr"></div>
    <div style="display:flex;gap:8px">
      <button class="act primary" type="submit" style="flex:1;justify-content:center">保存</button>
      <button class="act" type="button" onclick="hideAcct()" style="flex:0 0 76px;justify-content:center">取消</button>
    </div>
    <button class="act" type="button" onclick="logout()" style="opacity:.7">退出登录</button>
  </form>
</div>

<script>
/* === 管理员账号：登录 / 首次初始化 / 改账号 === */
let AUTH = { initialized: true, logged_in: false, username: '' };
let authMode = 'login';

function authEl(id){ return document.getElementById(id); }

function showAuth(title, hint, btn, mode){
  authMode = mode;
  const ov = authEl('authOverlay'); if(!ov) return;
  ov.classList.remove('hidden');
  authEl('authTitle').textContent = title || 'NeuroMem';
  authEl('authSub').textContent = hint || '';
  authEl('authBtn').textContent = btn || '登录';
  authEl('authPass2Wrap').classList.toggle('hidden', mode !== 'setup');
  authEl('authUser').value = '';
  authEl('authPass').value = '';
  authEl('authPass2').value = '';
  authEl('authErr').textContent = '';
  setTimeout(()=>{ try{ authEl('authUser').focus(); }catch(e){} }, 100);
}

function hideAuth(){ const ov = authEl('authOverlay'); if(ov) ov.classList.add('hidden'); }

function promptLogin(){ showAuth('NeuroMem', '登录已过期，请重新登录', '登录', 'login'); }

async function checkAuth(){
  try{
    const r = await fetch('/api/auth/me');
    AUTH = await r.json();
  }catch(e){
    AUTH = { initialized: true, logged_in: false, username: '' };
  }
  const su = authEl('sideUser');
  if(AUTH.logged_in){
    hideAuth();
    if(su) su.textContent = AUTH.username;
    return true;
  }
  if(su) su.textContent = '未登录';
  if(!AUTH.initialized) showAuth('NeuroMem', '首次使用：创建管理员账号', '创建并进入', 'setup');
  else showAuth('NeuroMem', '登录记忆管家', '登录', 'login');
  return false;
}

async function submitAuth(e){
  if(e) e.preventDefault();
  const u = authEl('authUser').value.trim();
  const p = authEl('authPass').value;
  if(authMode === 'setup' && p !== authEl('authPass2').value){
    authEl('authErr').textContent = '两次输入的密码不一致';
    return false;
  }
  const path = authMode === 'setup' ? '/api/auth/setup' : '/api/auth/login';
  const btn = authEl('authBtn');
  btn.disabled = true;
  try{
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                                 body: JSON.stringify({username:u, password:p})});
    const d = await r.json();
    if(!d.ok){ authEl('authErr').textContent = d.error || '登录失败'; return false; }
    hideAuth();
    AUTH = { initialized:true, logged_in:true, username:d.username };
    if(authEl('sideUser')) authEl('sideUser').textContent = d.username;
    loadOverview();
    switchTab('overview');
    toast('欢迎，' + d.username);
  }catch(err){
    authEl('authErr').textContent = '请求失败：' + err;
  }finally{
    btn.disabled = false;
  }
  return false;
}

async function logout(){
  try{ await fetch('/api/auth/logout', {method:'POST'}); }catch(e){}
  AUTH.logged_in = false;
  if(authEl('view')) authEl('view').innerHTML = '';
  showAuth('NeuroMem', '已退出登录', '登录', 'login');
}

function openAcct(){
  const m = authEl('acctModal'); if(!m) return;
  m.classList.remove('hidden');
  authEl('acUser').value = AUTH.username || '';
  authEl('acOld').value = '';
  authEl('acPass').value = '';
  authEl('acErr').textContent = '';
}

function hideAcct(){ const m = authEl('acctModal'); if(m) m.classList.add('hidden'); }

async function saveAccount(e){
  if(e) e.preventDefault();
  const r = await post('/api/auth/account', {
    old_password: authEl('acOld').value,
    username: authEl('acUser').value.trim(),
    password: authEl('acPass').value,
  });
  if(!r.ok){ authEl('acErr').textContent = r.error || '保存失败'; return false; }
  AUTH.username = r.username;
  if(authEl('sideUser')) authEl('sideUser').textContent = r.username;
  hideAcct();
  toast('账号已更新');
  return false;
}

const $ = s => document.querySelector(s);

async function api(p){
  const r = await fetch(p);
  if(r.status === 401){ promptLogin(); return new Promise(()=>{}); }
  return r.json();
}
async function post(p, body){
  const r = await fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  if(r.status === 401){ promptLogin(); return new Promise(()=>{}); }
  return r.json();
}
async function put(p, body){
  const r = await fetch(p, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  if(r.status === 401){ promptLogin(); return new Promise(()=>{}); }
  return r.json();
}
async function del(p){
  const r = await fetch(p, {method:'DELETE'});
  if(r.status === 401){ promptLogin(); return new Promise(()=>{}); }
  return r.json();
}
function esc(s){ return (s||'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none', 2200);
}

const PAGE_META = {
  overview: ['概览', '发育状态与近期动态'],
  events: ['记忆', '写入、编辑、删除与检索'],
  concepts: ['认知', '概念层级与自我叙事'],
  personas: ['人物', '画像、别名与相关记忆'],
  relations: ['关系', '人与人之间的连接'],
  graph: ['图谱', '事件 · 人物 · 概念'],
  growth: ['成长', '阶段、评分与代谢快照'],
  chat: ['对话', '基于记忆的回答'],
  models: ['模型', '配置与调用用量'],
  persona: ['人设', '陪伴 agent 的人格与说话方式（L0，人工设定）'],
  data: ['数据', '备份、导出与危险操作'],
  support: ['支持', '如果 Recollect 帮到了你'],
};

async function loadOverview(){
  const o = await api('/api/overview');
  const score = (o.evaluation || {}).score;
  const stage = o.stage + (o.level >= 0 ? ' · L' + o.level : '');
  const set = (id, v) => { const el = $(id); if(el) el.textContent = v; };
  set('#sideStage', o.stage);
  set('#sideScore', score != null ? score : '—');
  set('#sideEvents', o.active_events);
  set('#topStage', stage);
  set('#topScore', '评分 ' + (score != null ? score : '—'));
}

// ---------------- 记忆 ----------------
const TAG_OPTIONS = ['旅游','工作','家庭','学习','健康','饮食','宠物','消费','居住','娱乐','情绪','社交'];
let EVENT_FILTER = {q:'', archived:-1, persona:'', tag:''};

function hasFilter(){
  return !!(EVENT_FILTER.q || EVENT_FILTER.archived !== -1 || EVENT_FILTER.persona || EVENT_FILTER.tag);
}

function evQuery(){
  const p = new URLSearchParams();
  if(EVENT_FILTER.q) p.set('q', EVENT_FILTER.q);
  if(EVENT_FILTER.archived !== -1) p.set('archived', String(EVENT_FILTER.archived));
  if(EVENT_FILTER.persona) p.set('persona', EVENT_FILTER.persona);
  if(EVENT_FILTER.tag) p.set('tag', EVENT_FILTER.tag);
  const s = p.toString();
  return s ? '?' + s : '';
}

function eventsToolbar(personas){
  const opts = (personas || []).map(p =>
    `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  return `
  <div class="panel">
    <input id="evQ" placeholder="搜索内容 / 地点…" style="flex:1;min-width:180px"
           onkeydown="if(event.key==='Enter'){applyEventFilter()}">
    <select id="evArch">
      <option value="-1">全部状态</option>
      <option value="0">仅活跃</option>
      <option value="1">仅归档</option>
    </select>
    <select id="evPersona"><option value="">全部人物</option>${opts}</select>
    <select id="evTag"><option value="">全部标签</option>${TAG_OPTIONS.map(t=>`<option>${t}</option>`).join('')}</select>
    <button class="act" onclick="applyEventFilter()">筛选</button>
    <button class="act" onclick="clearEventFilter()">清空</button>
  </div>
  <div class="panel">
    <textarea id="newText" placeholder="输入一条记忆，例如：今天和小明去公园放风筝，他很开心"></textarea>
    <select id="newSpeaker">
      <option value="用户">用户说</option>
      <option value="我">我说</option>
    </select>
    <button class="act primary" onclick="addMemory()">记住</button>
  </div>`;
}

function syncFilterUI(){
  const q = $('#evQ'); if(q) q.value = EVENT_FILTER.q;
  const a = $('#evArch'); if(a) a.value = String(EVENT_FILTER.archived);
  const p = $('#evPersona'); if(p) p.value = EVENT_FILTER.persona;
}

function applyEventFilter(){
  const q = $('#evQ'), a = $('#evArch'), p = $('#evPersona'), t = $('#evTag');
  EVENT_FILTER.q = q ? q.value.trim() : '';
  EVENT_FILTER.archived = a ? parseInt(a.value, 10) : -1;
  EVENT_FILTER.persona = p ? p.value : '';
  EVENT_FILTER.tag = t ? t.value : '';
  switchTab('events');
}

function clearEventFilter(){
  EVENT_FILTER = {q:'', archived:-1, persona:'', tag:''};
  switchTab('events');
}

function emptyGuide(){
  return `<div class="card" style="max-width:780px">
    <div class="v">还是一片空白 —— 先给它第一条记忆</div>
    <div class="hint" style="margin:8px 0 14px">不用写得像档案，一句话就够。它会先“感知”，再慢慢长出概念和人物。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <textarea id="newText" style="flex:1;min-width:260px;min-height:44px" placeholder="例如：今天和小明去公园放风筝，风很大，他笑得特别开心"></textarea>
      <select id="newSpeaker"><option value="用户">用户说</option><option value="我">我说</option></select>
      <button class="act primary" onclick="addMemory()">记住第一条</button>
    </div>
    <div class="hint" style="margin-top:16px">成长路线</div>
    <ol style="color:#c9cbe0;font-size:13px;line-height:1.9;margin:6px 0 0 18px">
      <li>写第 1 条 → 进入「感知期」</li>
      <li>写够 3 条 → 进入「情节期」，能回忆具体事件</li>
      <li>积累 5 条以上同主题 → 跑一次 <code>python -m neuromem evolve</code>，长出「概念」</li>
    </ol>
  </div>`;
}

function kv(k, v){ return `<tr><th style="width:84px">${k}</th><td>${esc(v)}</td></tr>`; }

function closeDrawer(){
  const d = $('#drawer'); if(d) d.remove();
  const m = $('#drawerMask'); if(m) m.remove();
  document.removeEventListener('keydown', drawerEsc);
}
function drawerEsc(e){ if(e.key === 'Escape') closeDrawer(); }

async function openEvent(id){
  closeDrawer();
  const d = await api('/api/events/' + id);
  if(d.ok === false){ toast('事件不存在'); return; }
  const a = d.affect || {};
  const list = (arr, tpl, empty='无') =>
    (arr && arr.length) ? arr.map(tpl).join('') : `<span class="hint">${empty}</span>`;
  const val = a.valence != null ? ` (${a.valence > 0 ? '+' : ''}${a.valence})` : '';
  document.body.insertAdjacentHTML('beforeend', `
  <div id="drawerMask" class="drawer-mask" onclick="closeDrawer()"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-head">
      <h3>记忆详情</h3>
      <button class="act" onclick="closeDrawer()">关闭</button>
    </div>
    <div style="margin-top:14px;font-size:15px;line-height:1.7">${esc(d.gist)}</div>
    <div class="hint" style="margin-top:6px;font-size:11px">${esc(d.id)}
      ${d.working ? '<span class="tag" style="background:rgba(108,140,255,.14);color:#9FB4FF">工作台</span>' : ''}</div>
    <table style="margin-top:14px"><tbody>
      ${kv('时间', d.occurred_at || d.time_text || '-')}
      ${kv('地点', d.place || '-')}
      ${kv('情绪', (a.label || '-') + val)}
      ${kv('显著度', Number(d.salience || 0).toFixed(2))}
      ${kv('意外度', d.surprise == null ? '—' : Number(d.surprise).toFixed(2))}
      ${kv('激活度', Number(d.activation || 0).toFixed(2) + (d.archived ? ' · 已归档' : ''))}
      ${kv('置信度', d.confidence != null ? Number(d.confidence).toFixed(2) : '-')}
      ${kv('来源', d.provenance || '-')}
      ${kv('上次召回', d.last_recalled_at || '-')}
    </tbody></table>

    <div class="hint" style="margin-top:18px">涉及人物</div>
    <div style="margin-top:6px">${list(d.personas, p => `<span class="pill">${esc(p)}</span>`)}</div>

    <div class="hint" style="margin-top:18px">所属概念</div>
    <div style="margin-top:6px">${list(d.concepts, c => `<span class="pill concept">L${c.abstraction_level} ${esc(c.text)}</span>`)}</div>

    <div class="hint" style="margin-top:18px">语义邻居</div>
    <div style="margin-top:6px">${list(d.neighbors, n => `<div class="hit">${esc(n.gist || n.id)} <span class="hint">${Number(n.weight || 0).toFixed(2)}</span></div>`)}</div>

    <div class="hint" style="margin-top:18px">原文碎片</div>
    <div style="margin-top:6px">${list(d.fragments, f => `<div class="hit">${esc(f.text)}</div>`)}</div>

    <div style="margin-top:22px;display:flex;gap:8px">
      <button class="act" onclick="closeDrawer();editMemory('${d.id}')">编辑</button>
      <button class="act" onclick="closeDrawer();toggleArchive('${d.id}', ${d.archived ? 0 : 1})">${d.archived ? '恢复' : '归档'}</button>
      <button class="act danger" onclick="closeDrawer();deleteMemory('${d.id}')">删除</button>
    </div>
  </div>`);
  document.addEventListener('keydown', drawerEsc);
}

function renderEvents(rows, personas){
  if(!rows.length && !hasFilter()) return emptyGuide();
  const trs = rows.map(r=>{
    const a = r.affect||{};
    const st = r.archived ? '<span class="tag">已归档</span>' : '';
    const tags = (r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(' ');
    return `<tr style="cursor:pointer" onclick="openEvent('${r.id}')">
      <td>${esc(r.gist)} ${st} ${tags}</td>
      <td>${esc(r.occurred_at||r.time_text||'-')}</td>
      <td>${esc(r.place||'-')}</td>
      <td>${esc(a.label||'-')} ${a.valence!=null?`(${a.valence>0?'+':''}${a.valence})`:''}</td>
      <td>${(r.salience||0).toFixed(2)}</td>
      <td>${(r.activation||0).toFixed(2)}</td>
      <td>
        <button class="act" onclick="event.stopPropagation();editMemory('${r.id}')">编辑</button>
        <button class="act" onclick="event.stopPropagation();toggleArchive('${r.id}', ${r.archived?0:1})">${r.archived?'恢复':'归档'}</button>
        <button class="act danger" onclick="event.stopPropagation();deleteMemory('${r.id}')">删除</button>
      </td>
    </tr>`;
  }).join('');
  const table = rows.length
    ? `<table><thead><tr><th>事件</th><th>时间</th><th>地点</th><th>情绪</th><th>显著</th><th>激活</th><th>操作</th></tr></thead><tbody>${trs}</tbody></table>`
    : `<div class="empty">没有匹配的记忆 —— 换个关键词，或点「清空」重置筛选</div>`;
  return eventsToolbar(personas) + table;
}

async function addMemory(){
  const text = $('#newText').value.trim();
  if(!text) return toast('请输入记忆内容');
  const speaker = $('#newSpeaker').value;
  toast('抽取中…');
  const r = await post('/api/events', {text, speaker});
  if(r.error){ toast('写入失败'); $('#view').insertAdjacentHTML('afterbegin',
    `<div class="panel" style="border-color:#4a2630;color:#ffb3b3">${esc(r.error)}</div>`); return; }

  else { toast('未抽取到有效事件'); }

}

async function editMemory(id){
  const rows = await api('/api/events');
  const row = rows.find(x=>x.id===id);
  const gist = prompt('修改事件内容：', row ? row.gist : '');
  if(gist===null) return;
  const place = prompt('地点（留空不变）：', row ? (row.place||'') : '');
  const body = {gist: gist.trim()};
  if(place!==null && place.trim()!==(row&&row.place||'')) body.place = place.trim();
  const r = await put('/api/events/'+id, body);
  toast('已保存');
  if(r && r.warnings && r.warnings.length){ setTimeout(() => toast(r.warnings[0]), 900); }
  switchTab('events');
}

  await post(`/api/events/${id}/archive?archived=${v}`);

}

async function deleteMemory(id){

  await del('/api/events/'+id);
  toast('已删除');
  await loadOverview(); switchTab('events');
}

// 首次配置引导：空库新实例就显示（不管本地还是云端），教用户把模型跑起来。
// 本地 Ollama → 提示拉模型命令；云端没 Key → 提示填自己的 Key。
// 库里已有记忆、或云端已配好 Key，视为「已在用」，不再打扰。
// 点「稍后」写入 localStorage 不再提示；点「去配置」跳模型页。
async function setupBannerHtml(){
  try{
    let dismissed = false;
    try{ dismissed = localStorage.getItem('recollect_setup_dismissed') === '1'; }catch(e){}
    if(dismissed) return '';
    const [d, ov] = await Promise.all([api('/api/settings'), api('/api/overview')]);
    const L = (d.settings || {}).llm || {};
    const cloud = L.provider === 'openai_compat';
    const hasKey = !!(L.api_key_info && L.api_key_info.set);
    const empty = !ov || (ov.active_events || 0) === 0;
    if(!empty) return '';              // 已有记忆：在使用过程中，不打扰
    if(cloud && hasKey) return '';     // 云端已配 Key：不打扰

    let title, desc;
    if(cloud && !hasKey){
      title = '云端模式还没配置 API Key';
      desc = `当前指向 <code>${esc(L.base_url || '')}</code>，但没有 Key，模型调用会失败。
        在「模型」页点一个预设（推荐 <b>deepseek</b>）并填入<strong>你自己的 API Key</strong>；
        或切回本地 Ollama（无需 Key）。`;
    }else{
      title = '欢迎 —— 这是一个干净的空白实例';
      desc = `本项目不内置任何模型或密钥。默认用本地 Ollama（无需 Key）：先安装 Ollama，
        再拉取两个模型 <code>ollama pull qwen3-embedding:4b</code> 与
        <code>ollama pull qwen3.5:4b</code>。没有本地环境也可在「模型」页切云端并填自己的 Key
        （推荐 DeepSeek，注册即有额度）。模型推荐与申请地址见仓库 README 的「模型与获取」一节。`;
    }
    return `<div class="setup-banner" id="setupBanner">
      <div class="ico">&#9881;</div>
      <div class="body">
        <b>${title}</b>
        <p>${desc}</p>
        <div class="acts">
          <button class="act primary" onclick="dismissSetup('go')">去「模型」页配置</button>
          <button class="act" onclick="dismissSetup('later')">知道了 / 稍后再说</button>
        </div>
      </div>
    </div>`;
  }catch(e){ return ''; }
}

function dismissSetup(action){

}

function evolveText(s){
  if(!s) return '';
  if(!s.enabled) return '自动进化已关闭（NEUROMEM_AUTOEVOLVE=0）';
  const last = s.last_run ? s.last_run.slice(0, 16).replace('T', ' ') : '尚未代谢';
  const mins = Math.round((s.interval || 600) / 60);
  const pending = `待处理 ${s.events_since} 条（阈值 ${s.threshold}）`;
  const sur = (s.surprise_since == null) ? '' : ` · 意外累积 ${s.surprise_since}/${s.surprise_trigger}`;
  return `自动进化 · 每 ${mins} 分钟 · 上次 ${last} · ${pending}${sur}${s.running ? ' · 进行中…' : ''}`;
}

async function renderConceptsTab(){
  const [rows, self] = await Promise.all([api('/api/concepts'), api('/api/self')]);
  const selfHtml = `<div class="card" style="margin-bottom:14px">
    <div class="k">自我叙事</div>
    <div style="margin-top:8px;color:#c9cbe0;line-height:1.8">${
      self.text ? esc(self.text) : '<span class="hint">还没有自述 —— 经历足够多后会自动形成</span>'}</div>
    ${self.updated_at ? `<div class="hint" style="margin-top:6px">更新于 ${esc(self.updated_at)}</div>` : ''}
    <div style="margin-top:10px"><button class="act" onclick="rebuildSelf()">重新生成</button></div>
  </div>`;
  if(!rows.length){
    $('#view').innerHTML = selfHtml +
      '<div class="empty">暂无概念 —— 写够 5 条同主题经历后跑一次 evolve 就会归纳出来</div>';
    return;
  }
  const groups = {};
  rows.forEach(r => {
    const k = r.abstraction_level;
    if(!groups[k]) groups[k] = [];
    groups[k].push(r);
  });
  const levels = Object.keys(groups).map(Number).sort((a, b) => b - a);
  const body = levels.map(lv => `
    <div class="hint" style="margin:14px 0 6px">L${lv} · ${groups[lv].length} 个</div>
    ${groups[lv].map(r => `
      <div class="card" style="margin-bottom:10px;cursor:pointer" onclick="openConcept('${r.id}')">
        <div style="font-size:14px;line-height:1.7">${esc(r.text)}</div>
        <div class="hint" style="margin-top:6px">来源 ${r.n} 条经历 · 置信度 ${(r.confidence || 0).toFixed(2)}</div>
      </div>`).join('')}
  `).join('');
  $('#view').innerHTML = selfHtml + body;
}

      </div>`
    : '';
  const nameCell = (r, who) => (r[who] ? esc(r[who]) : '') +
    (r[who + '_missing'] ? ` <span class="tag" style="background:#4a2630;color:#ff9b9b">人物已删除</span>` : '');
  const trs = rows.map(r => `<tr style="${r.broken ? 'opacity:.55' : ''}">
      <td>${nameCell(r, 'a')}</td>
      <td><span class="tag">${esc(r.type)}</span></td>
      <td>${nameCell(r, 'b')}</td>
      <td>${(r.strength || 0).toFixed(2)}</td>
      <td>
        <button class="act" onclick="editRelation('${r.id}')">编辑</button>
        <button class="act danger" onclick="deleteRelation('${r.id}')">删除</button>
      </td>
    </tr>`).join('');
  const table = rows.length
    ? `<table><thead><tr><th>A</th><th>关系</th><th>B</th><th>强度</th><th>操作</th></tr></thead><tbody>${trs}</tbody></table>`
    : '<div class="empty">还没有关系 —— 在上面选两个人、填个关系词就能建立</div>';
  return panel + fixBar + table;
}

async function healRelations(){
  const r = await post('/api/relations/heal');
  if(!r.ok){ toast('修复失败'); return; }
  toast(r.healed.length ? `已修复 ${r.healed.length} 条关系` : '没有能自动修复的（无法确认指向谁）');
  if(r.remaining && r.remaining.length)
    toast(`仍有 ${r.remaining.length} 条无法自动修复，已标注「人物已删除」`);
  switchTab('relations');
}

async function addRelation(){
  const a = v('#relA'), b = v('#relB'), t = v('#relType');
  if(!a || !b || !t) return toast('请选择两个人物并填写关系');
  if(a === b) return toast('不能和自己建立关系');
  const s = parseFloat(v('#relStrength') || '0.5');
  const r = await post('/api/relations',
    {a, b, type: t, strength: isNaN(s) ? 0.5 : Math.max(0, Math.min(1, s))});
  if(r.ok){ toast(r.updated ? '关系已存在，强度已更新' : '关系已添加'); switchTab('relations'); }
  else { toast(r.error || '添加失败'); }
}

async function editRelation(id){
  const rows = await api('/api/relations');
  const r = rows.find(x => x.id === id);
  if(!r) return;
  const t = prompt('关系类型：', r.type);
  if(t === null) return;
  const sv = prompt('强度（0~1）：', String(r.strength != null ? r.strength : 0.5));
  if(sv === null) return;
  const body = {};
  if(t.trim()) body.type = t.trim();
  const sn = parseFloat(sv);
  if(!isNaN(sn)) body.strength = Math.max(0, Math.min(1, sn));
  const res = await put('/api/relations/' + id, body);
  toast(res.ok ? '已保存' : (res.error || '保存失败'));
  if(res.ok) switchTab('relations');
}

async function deleteRelation(id){
  if(!confirm('删除这条关系？')) return;
  const r = await del('/api/relations/' + id);
  toast(r.ok ? '已删除' : '删除失败');
  if(r.ok) switchTab('relations');
}

async function deleteConcept(id){
  if(!confirm('删除这个概念？来源事件会保留。')) return;
  const r = await del('/api/concepts/' + id);
  if(r.ok){ toast('已删除'); closeDrawer(); switchTab('concepts'); }
  else { toast(r.error || '删除失败'); }
}

async function mergeConcept(id){
  const rows = await api('/api/concepts');
  const others = (rows || []).filter(x => x.id !== id);
  if(!others.length){ toast('没有可合并的目标概念'); return; }
  const list = others.slice(0, 12).map((x,i)=>`${i+1}. ${(x.text||'').slice(0,18)}`).join('\n');
  const pick = prompt('合并到哪个概念？输入序号：\n' + list);
  const idx = parseInt(pick, 10) - 1;
  if(!(idx >= 0 && idx < others.length)) return;
  const target = others[idx];
  if(!confirm(`把当前概念合并到「${target.text}」？合并后当前概念会被删除，来源事件保留。`)) return;
  const r = await post('/api/concepts/merge', {keep: target.id, drop: id});
  toast(r.ok ? `已合并，共 ${r.events} 条来源` : (r.error || '合并失败'));
  if(r.ok){ closeDrawer(); switchTab('concepts'); }
}

async function deletePersona(id, n){
  let force = 0;
  if(n > 0){
    if(!confirm(`该人物关联 ${n} 条记忆，删除会解除绑定（记忆本身保留）。继续？`)) return;
    force = 1;
  }else{
    if(!confirm('删除这个人物？')) return;
  }
  const r = await del(`/api/personas/${id}?force=${force}`);
  if(r.ok){ toast('已删除'); closeDrawer(); switchTab('personas'); }
  else { toast(r.error || '删除失败'); }
}

// ---------------- 对话 ----------------
let chatHistory = [];
let proactiveOn = true;          // 主动关怀开关；关掉后不再拉取、也不展示
let proactiveTimer = null;

// proactive id 是字符串（pro_xxx），直接拼进 onclick 会被 JS 当成变量名 → 点击报 ReferenceError，表现就是"没反应"
function jsAttr(v){ return esc(JSON.stringify(String(v==null?'':v))); }

// 消息时间戳（浏览器本地时间，仅前端展示）。带日期，跨天也能看清。
function fmtMsgTs(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function tsLine(m){ return m.ts ? `<div class="ts">${esc(m.ts)}</div>` : ''; }

function messageHTML(m){
  if(m.role==='proactive'){
    const pid = jsAttr(m.proactiveId);
    return `<div class="msg proactive"><span class="pflag">它主动想起你</span>${esc(m.text)}
      <div class="pc-act"><button onclick="proactiveReply(${pid})">回应它</button><button onclick="proactiveDismiss(${pid})">忽略</button></div>${tsLine(m)}</div>`;
  }
  if(m.role==='thinking'){
    return `<div class="msg thinking">它在想…</div>`;
  }
  if(m.role==='bot'){
    const meta = m.meta ? `<div class="meta">${esc(m.meta)}</div>` : '';
    const rem = (m.remembered && m.remembered.length)
      ? `<div class="remember">牢记：${m.remembered.map(esc).join('；')}</div>` : '';
    const hits = m.hits ? m.hits.map(h=>`<div class="hit">${esc(h)}</div>`).join('') : '';
    return `<div class="msg bot"><b>NeuroMem：</b>${esc(m.text)}${rem}${hits}${meta}${tsLine(m)}</div>`;
  }
  const who = m.role==='user'?'你：':'NeuroMem：';
  return `<div class="msg ${m.role}"><b>${who}</b>${esc(m.text)}${tsLine(m)}</div>`;
}

// 通道状态：把"它记得多少"摆在对话上方，机制不藏在后台
let LIVE = null;
let liveMode = true;             // true=陪伴对话（写记忆）；false=只读查询（/api/ask）

function liveBarInner(){
  const s = LIVE || {};
  const last = s.last_turn_at ? String(s.last_turn_at).replace('T',' ').slice(0,16) : '—';
  return `<span class="dot ${s.enabled?'on':'off'}"></span>
    <b>${liveMode?'陪伴对话 · 会记住你说的话':'只读查询 · 不写入记忆'}</b>
    <span>记忆 ${s.events==null?'-':s.events} 件 · 对话 ${s.turns_stored==null?'-':s.turns_stored} 轮 · 上次 ${esc(last)}</span>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:auto;color:var(--fg-2)">
      <input type="checkbox" ${liveMode?'checked':''} onchange="toggleLive(this.checked)"> 让它记住
    </label>`;
}

async function refreshLiveStatus(){
  try{
    const r = await api('/api/live/status');
    if(r && r.ok){ LIVE = r; const b=$('#livebar'); if(b) b.innerHTML = liveBarInner(); }
  }catch(e){ /* 状态拿不到不影响对话 */ }
}

function toggleLive(on){
  liveMode = !!on;
  if($('#view')) $('#view').innerHTML = renderChat();
  toast(liveMode ? '陪伴模式：说的话会被记住' : '只读模式：只查记忆，不写入');
}

function renderChat(){
  return `<div class="panel">
      <input id="askInput" style="flex:1;min-width:240px" placeholder="${liveMode?'随便说点什么，它会记住':'问它：上周我和小明去哪了？'}">
      ${liveMode?'':`<input id="askName" style="width:110px" value="用户" title="对话者称呼">`}
      <button class="act primary" onclick="doAsk()">发送</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);cursor:pointer;margin-left:6px">
        <input type="checkbox" id="proactiveToggle" ${proactiveOn?'checked':''} onchange="toggleProactive(this.checked)"> 允许它主动关心我
      </label>
    </div>
    <div class="livebar" id="livebar">${liveBarInner()}</div>
    <div class="chatbox" id="chatbox">
      ${chatHistory.length? chatHistory.map(messageHTML).join('') : `<div class="empty">${liveMode?'跟它说句话试试——说过的它会记住，下次能想起来':'只读模式下不会写入任何记忆'}</div>`}
    </div>`;
}

// 主动发起出口：只在对话页轮询，拿到一条就插入一条特殊气泡（展示即消费，绝不重复）
async function pollProactive(){
  if(!proactiveOn) return;
  try{
    const r = await api('/api/proactive');
    if(r && r.ok && r.available && r.text){
      if(!chatHistory.some(m=>m.role==='proactive' && m.proactiveId===r.id)){
        chatHistory.push({role:'proactive', text:r.text, proactiveId:r.id, topic:r.topic, ts:fmtMsgTs(new Date())});
        const box=$('#view'); if(box && $('#chatbox')){ box.innerHTML = renderChat(); const c=$('#chatbox'); if(c) c.scrollTop=c.scrollHeight; }
      }
    }
  }catch(e){ /* 主动消息失败不该影响对话 */ }
}
function toggleProactive(on){
  proactiveOn = !!on;
  if(!proactiveOn){ chatHistory = chatHistory.filter(m=>m.role!=='proactive'); if($('#view')) $('#view').innerHTML = renderChat(); }
  else pollProactive();
}
function proactiveReply(pid){
  const m = chatHistory.find(x=>x.role==='proactive' && x.proactiveId===pid);
  chatHistory = chatHistory.filter(x=>!(x.role==='proactive' && x.proactiveId===pid));
  if(m && m.topic && $('#askInput')) $('#askInput').value = m.topic;
  if($('#view')) $('#view').innerHTML = renderChat();
  const inp=$('#askInput'); if(inp) inp.focus();
  toast('话题已填入，点发送即可回应');
}
function proactiveDismiss(pid){
  chatHistory = chatHistory.filter(x=>!(x.role==='proactive' && x.proactiveId===pid));
  if($('#view')) $('#view').innerHTML = renderChat();
}
function startProactivePolling(){
  stopProactivePolling();
  pollProactive();
  proactiveTimer = setInterval(pollProactive, 60000);   // 每分钟最多看一次，不打扰
}
function stopProactivePolling(){
  if(proactiveTimer){ clearInterval(proactiveTimer); proactiveTimer=null; }
}

async function doAsk(){
  const q = ($('#askInput').value||'').trim();
  if(!q) return;
  if(liveMode) return doLive(q);        // 默认走真记忆通道
  const name = (($('#askName')||{}).value)||'用户';
  chatHistory.push({role:'user', text:q, ts:fmtMsgTs(new Date())});
  $('#view').innerHTML = renderChat();
  toast('检索与生成中…');
  const t0 = Date.now();
  let r;
  try { r = await post('/api/ask', {query:q, user_name:name}); }
  catch(e){ r = {summary:'请求失败：'+e}; }
  const hits = (r.events||[]).slice(0,5).map(e=>{
    const g = e.gist||e.text||'';
    const sc = e.score!=null? ` [${Number(e.score).toFixed(2)}]`:'';
    const cf = e.confidence? ` (${e.confidence})`:'';
    return g+sc+cf;
  });
  const warn = (r.warnings || []).join('\n');
  const botText = (r.summary || '（没有找到相关记忆）') + (warn ? '\n\n⚠ ' + warn : '');
  chatHistory.push({role:'bot', text: botText, hits, ts:fmtMsgTs(new Date())});
  const dt = ((Date.now()-t0)/1000).toFixed(1);
  toast(`只读查询 · ${dt}s · 命中 ${(r.events||[]).length} 条 · 未写入`);
  $('#view').innerHTML = renderChat();
  const box=$('#chatbox'); if(box) box.scrollTop = box.scrollHeight;
}

// 陪伴对话：真走 CompanionAgent，会写会话轮次与事实。回执要让用户看见"记住了什么"。
let liveBusy = false;

async function doLive(q){
  if(liveBusy){ toast('上一句还在想，等它答完'); return; }
  liveBusy = true;
  chatHistory = chatHistory.filter(m=>m.role!=='thinking');
  chatHistory.push({role:'user', text:q, ts:fmtMsgTs(new Date())});
  chatHistory.push({role:'thinking'});
  $('#view').innerHTML = renderChat();
  let bx=$('#chatbox'); if(bx) bx.scrollTop = bx.scrollHeight;

  const t0 = Date.now();
  let r = null;
  try { r = await post('/api/live', {query:q}); }
  catch(e){ r = {ok:false, error:'请求失败：'+String(e)}; }

  chatHistory = chatHistory.filter(m=>m.role!=='thinking');
  if(!r || !r.ok){
    chatHistory.push({role:'bot',
      text:'（这轮没走通）'+(r&&r.error?('\n'+r.error):'')+(r&&r.hint?('\n'+r.hint):''), ts:fmtMsgTs(new Date())});
  }else{
    chatHistory.push({role:'bot', text:r.reply||'（它没说话）',
                      meta:r.hint||'', remembered:r.remembered||[], ts:fmtMsgTs(new Date())});
  }
  liveBusy = false;
  const dt = ((Date.now()-t0)/1000).toFixed(1);
  if(r && r.ok){
    toast(`已记住 · ${dt}s · 写入 ${r.remembered_count||0} 条 · 引用 ${r.used||0} 条`);
  }else{
    toast('这轮没走通 · '+((r&&(r.hint||r.error))||'未知'));
  }
  $('#view').innerHTML = renderChat();
  bx=$('#chatbox'); if(bx) bx.scrollTop = bx.scrollHeight;
  refreshLiveStatus();
}

let SETTINGS = null, SETTINGS_PRESETS = {};

function v(id){ const el = $(id); return el ? el.value.trim() : ''; }

function keyHint(info){
  if(!info || !info.set) return '';
  return `已保存 ${info.head || ''}…${info.tail}（${info.len} 位）· 留空不修改`;
}

async function clearKey(which){
  if(!confirm('清除已保存的 ' + (which === 'llm' ? '对话' : '嵌入') + ' Key？')) return;
  const r = await put('/api/settings', {clear_key: which});
  SETTINGS = r.settings; fillSettings(r.settings);

function fillSettings(s){
  if(!s) return;
  const L = s.llm || {}, E = s.embed || {};
  const put = (id, val) => { const el = $(id); if(el && val != null) el.value = val; };
  put('#llmProvider', L.provider); put('#llmBase', L.base_url);
  put('#llmExtract', L.extract_model); put('#llmAnswer', L.answer_model);
  put('#embedProvider', E.provider); put('#embedBase', E.base_url);
  put('#embedModel', E.model); put('#embedDim', E.dim);
  // Key 输入框始终留空：留空=不修改，避免把掩码回填后“追加”成无效值
  const lk = $('#llmKey'), ek = $('#embedKey');
  if(lk){ lk.value = ''; lk.placeholder = keyHint(L.api_key_info) || '本地 Ollama 可留空'; }
  if(ek){ ek.value = ''; ek.placeholder = keyHint(E.api_key_info) || '本地 Ollama 可留空'; }
  const th = $('#llmThink'); if(th) th.checked = !!L.think;
}

async function toggleThink(on){
  // 只发 think 一个字段：不改表单里其他未保存的输入
  const r = await put('/api/settings', {llm: {think: !!on}});
  if(r && r.ok){
    SETTINGS = r.settings || SETTINGS;
    toast(on ? '已开启深度思考（更慢，正文预算已留足）' : '已关闭深度思考');
  }else{
    toast('切换失败，请重试');
    const th = $('#llmThink');
    if(th) th.checked = !on;

// 嵌入模型推荐：全部支持 2560 维输出，与本项目默认库一致，换维度不会静默失效。
// qwen3-embedding:4b 原生 2560；8B 及云端 Qwen3 系列用 dimensions 截断到 2560；
// OpenAI 需 text-embedding-3-large（3-small 上限 1536，到不了 2560）。
// 只填表、不自动保存；注意：维度相同不代表向量空间相同，换模型仍建议重建向量。
// 商汤 Token Plan 网关无 embeddings 端点，故不在其中（用它的对话模型时保留本地嵌入）。
const EMBED_RECOMMENDS = {
  '本地·qwen3-embedding:4b（原生2560，推荐）': {provider:'ollama', useLocal:true, model:'qwen3-embedding:4b', dim:2560},
  '本地·qwen3-embedding:8b（2560）': {provider:'ollama', useLocal:true, model:'qwen3-embedding:8b', dim:2560},
  '硅基流动·Qwen3-Embedding-4B（2560）': {provider:'openai_compat', base:'https://api.siliconflow.cn/v1', model:'Qwen/Qwen3-Embedding-4B', dim:2560},
  '硅基流动·Qwen3-Embedding-8B（2560）': {provider:'openai_compat', base:'https://api.siliconflow.cn/v1', model:'Qwen/Qwen3-Embedding-8B', dim:2560},
  'OpenAI·text-embedding-3-large（2560）': {provider:'openai_compat', base:'https://api.openai.com/v1', model:'text-embedding-3-large', dim:2560},
};

function applyEmbedRecommend(name){
  const r = EMBED_RECOMMENDS[name];
  if(!r) return;
  const set=(id,val)=>{const el=$(id); if(el) el.value=val;};
  const base = r.useLocal ? ((SETTINGS_PRESETS.ollama||{}).base_url || 'http://127.0.0.1:11434') : r.base;
  set('#embedProvider', r.provider); set('#embedBase', base);
  set('#embedModel', r.model); set('#embedDim', r.dim);
  const warn = `这些都是 2560 维，与默认库一致。但注意：维度相同不代表向量空间相同——`
    + `换模型后请到「数据」页点「重建向量」，用新模型重算全部记忆（不丢数据）。`;
  $('#setResult').textContent = `已填入嵌入推荐「${name}」，记得点「保存并立即生效」。${warn}`;
}

  fillSettings(SETTINGS);

function warnKeyShape(s){
  const li = (s && s.llm && s.llm.api_key_info) || {};
  const base = ((s && s.llm && s.llm.base_url) || '').toLowerCase();
  if(li.set && li.head && li.head !== 'sk-' && (base.includes('deepseek') || base.includes('openai'))){
    $('#setResult').textContent =
      `⚠ 已保存的 Key 以「${li.head}」开头，但 DeepSeek / OpenAI 的 Key 都应以 sk- 开头——` +
      `很可能粘贴时开头被截断了。点「清除已保存 Key」后重新完整粘贴。`;
  }
}

function applyPreset(name){
  const p = SETTINGS_PRESETS[name];
  if(!p){ return; }
  const set = (id, val) => { const el = $(id); if(el && val != null) el.value = val; };
  // LLM / 抽取部分
  set('#llmProvider', p.provider); set('#llmBase', p.base_url);
  set('#llmExtract', p.extract_model); set('#llmAnswer', p.answer_model);
  // 嵌入部分：只有预设显式提供嵌入模型时才覆盖，
  // 否则会把 LLM 的 base_url 串到嵌入上（如 DeepSeek 没有 embeddings 接口）
  let msg = `已填入预设「${name}」，记得点「保存并立即生效」。`;
  if(p.model){
    set('#embedProvider', p.provider); set('#embedBase', p.base_url);
    set('#embedModel', p.model); set('#embedDim', p.dim);
  }else{
    msg += '\n该预设没有嵌入模型，嵌入保持当前配置（本地 Ollama bge-large 即可）。';
  }
  $('#setResult').textContent = msg;
}

function collectSettings(){
  const dim = parseInt(v('#embedDim') || '0', 10);
  const llm = {provider: v('#llmProvider'), base_url: v('#llmBase'),
               extract_model: v('#llmExtract'), answer_model: v('#llmAnswer')};
  const thEl = $('#llmThink'); if(thEl) llm.think = !!thEl.checked;
  const lk = v('#llmKey'); if(lk) llm.api_key = lk;      // 留空=不修改
  const embed = {provider: v('#embedProvider'), base_url: v('#embedBase'),
                 model: v('#embedModel'), dim: dim || undefined};
  const ek = v('#embedKey'); if(ek) embed.api_key = ek;
  return {llm, embed};
}

async function saveSettings(){
  const s = collectSettings();
  const tips = [];
  const base = (s.llm.base_url || '').toLowerCase();
  const freshKey = v('#llmKey');
  if(freshKey && !freshKey.startsWith('sk-') && (base.includes('deepseek') || base.includes('openai'))){
    tips.push(`Key 以「${freshKey.slice(0, 3)}」开头，但该服务的 Key 应以 sk- 开头，可能是粘贴不完整`);
  }
  const r = await put('/api/settings', s);
  if(!r.ok){ $('#setResult').textContent = '保存失败'; toast('保存失败'); return; }
  SETTINGS = r.settings;
  const lines = ['已保存，立即生效。'];
  const li = ((r.settings.llm || {}).api_key_info) || {};
  const ei = ((r.settings.embed || {}).api_key_info) || {};
  lines.push(`对话 Key：${li.set ? li.tail + '（' + li.len + ' 位）' : '未设置'} · 嵌入 Key：${ei.set ? ei.tail + '（' + ei.len + ' 位）' : '未设置'}`);
  for(const w of (r.warnings || [])) lines.push('⚠ ' + w);
  for(const t of tips) lines.push('⚠ ' + t);
  $('#setResult').textContent = lines.join('\n');
  fillSettings(r.settings);
  toast('设置已保存');
}

async function testModel(role){
  $('#setResult').textContent = `正在测试 ${role === 'embed' ? '嵌入' : '对话'}…`;
  const r = await post('/api/settings/test', {role});
  if(r.ok){
    $('#setResult').textContent = r.dim != null
      ? `嵌入连接成功 · ${r.latency}s · 维度 ${r.dim}`
      : `对话连接成功 · ${r.latency}s\n回复：${r.reply || '(空)'}`;
    toast('连接正常');
  }else{
    let msg = `失败（${r.latency}s）：${r.error}`;
    if(r.need_key) msg += '\n\n→ API Key 被服务端判定无效或已过期：请到平台重新生成，填入后点「保存并立即生效」（本地 Ollama 可留空）';
    $('#setResult').textContent = msg;
    toast('连接失败');
  }
}

async function loadModelList(){
  const s = collectSettings();
  const savedKey = !!(SETTINGS && SETTINGS.llm && SETTINGS.llm.api_key_info && SETTINGS.llm.api_key_info.set);
  const isLocal = /^(https?:\/\/)?(127\.0\.0\.1|localhost)/i.test(s.llm.base_url || '');
  if(s.llm.provider !== 'ollama' && !s.llm.api_key && !savedKey && !isLocal){
    $('#setResult').textContent =
      '这个云端地址需要 API Key：先在「API Key」填入密钥，点「保存并立即生效」，再拉取模型列表。\n' +
      '也可以跳过列表，直接手填模型名（如 deepseek-chat / deepseek-reasoner）。';
    return;
  }
  $('#setResult').textContent = '正在拉取模型列表…';
  const q = `?provider=${encodeURIComponent(s.llm.provider)}`
          + `&base_url=${encodeURIComponent(s.llm.base_url)}`
          + `&api_key=${encodeURIComponent(s.llm.api_key || '')}`;
  const r = await fetch('/api/settings/models' + q).then(x => x.json());
  if(!r.ok){
    $('#setResult').textContent = '获取失败：' + (r.error || '') +
      (r.need_key ? '\n\n→ 需要有效 API Key：填入后先「保存」，再重试；也可以直接手填模型名。' : '');
    return;
  }
  $('#setResult').textContent = '可用模型：\n' + (r.models || []).join('\n');
}

let PERSONA = null;
const _pv = (id, v) => { const el = $('#' + id); if (el) el.value = v == null ? '' : String(v); };
const _gv = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
const _ja = v => Array.isArray(v) ? v.join('，') : (v || '');

function fillPersonaForm(c) {
  const sp = c.speech || {}, rel = c.relationship || {};
  const ex = Array.isArray(c.examples) ? c.examples : [];
  _pv('pc_name', c.name === '（未命名）' ? '' : c.name);
  _pv('pc_role', c.role); _pv('pc_traits', _ja(c.traits));
  _pv('pc_style', sp.style); _pv('pc_length', sp.length);
  _pv('pc_address', sp.address); _pv('pc_catch', _ja(sp.catchphrases));
  _pv('pc_avoid', _ja(sp.avoid));
  _pv('pc_call', rel.call_user); _pv('pc_bond', rel.bond); _pv('pc_init', rel.initiative);
  _pv('pc_care', c.care); _pv('pc_mood', c.emotion_baseline);
  _pv('pc_bounds', _ja(c.boundaries));
  for (let i = 1; i <= 2; i++) {
    const e = ex[i - 1] || {};
    _pv('pc_ex' + i + 'u', e.user); _pv('pc_ex' + i + 'r', e.reply);
  }
}

function personaFormCard() {
  const ex = [];
  for (let i = 1; i <= 2; i++) {
    const u = _gv('pc_ex' + i + 'u'), r = _gv('pc_ex' + i + 'r');
    if (u || r) ex.push({user: u, reply: r});
  }
  return {
    name: _gv('pc_name'), role: _gv('pc_role'), traits: _gv('pc_traits'),
    speech: {
      style: _gv('pc_style'), address: _gv('pc_address'), length: _gv('pc_length'),
      catchphrases: _gv('pc_catch'), avoid: _gv('pc_avoid')
    },
    relationship: {
      call_user: _gv('pc_call'), bond: _gv('pc_bond'), initiative: _gv('pc_init')
    },
    care: _gv('pc_care'), boundaries: _gv('pc_bounds'),
    emotion_baseline: _gv('pc_mood'), examples: ex
  };
}

    <pre class="result" id="personaPreview" style="background:var(--bg-2);border:1px solid var(--line-soft);border-radius:9px;padding:12px;max-height:340px;overflow:auto">点击「预览注入文本」查看</pre>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="k">固定身份宪法 · v${esc(d.identity_version)}（校验：${esc(d.identity_verify)}）</div>
    <div class="hint" style="margin:6px 0 10px">这 5 项是不可逾越的底线，优先级高于人设；同样人工版本化、清库豁免、对话不能改写。改完保存，旧版自动归档。</div>
    <div class="pform">
      <label class="pfield wide">我是谁（who）<textarea id="id_who"></textarea></label>
      <label class="pfield wide">我服务谁（serve）<textarea id="id_serve"></textarea></label>
      <label class="pfield wide">称呼与边界（address）<textarea id="id_address"></textarea></label>
      <label class="pfield wide">语气与禁忌（tone）<textarea id="id_tone"></textarea></label>
      <label class="pfield wide">能力边界（limits）<textarea id="id_limits"></textarea></label>
    </div>
    <button class="act" onclick="saveIdentity()">保存宪法新版本</button>
    <span class="hint" id="identityStatus" style="margin-left:8px"></span>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="k">版本历史 · 回滚</div>
    <div id="personaHistory" style="margin-top:10px"><div class="hint">加载中…</div></div>
  </div>`;
  fillPersonaForm(d.card || {});
  fillIdentityForm(ident);
  loadPersonaHistory();
}

function fillIdentityForm(p) {
  ['who', 'serve', 'address', 'tone', 'limits'].forEach(k => _pv('id_' + k, p[k]));
}

async function saveIdentity() {
  const p = {};
  ['who', 'serve', 'address', 'tone', 'limits'].forEach(k => p[k] = _gv('id_' + k));
  const empty = Object.keys(p).filter(k => !p[k]);
  if (empty.length) { toast('宪法字段不能为空：' + empty.join('、')); return; }
  if (!confirm('保存宪法新版本？旧版会归档；人设与宪法冲突时以宪法为准。')) return;
  const r = await put('/api/identity', {
    confirm: 'IDENTITY', actor: 'human', reason: '后台管理修改', profile: p
  });
  if (r.ok) { toast('宪法已更新为 v' + r.version); renderPersona(); }
  else toast(r.error || '保存失败');
}

async function previewPersona() {
  const r = await post('/api/persona/preview', {card: personaFormCard()});
  const el = $('#personaPreview'), st = $('#personaStatus');
  if (!el) return;
  if (r.ok) {
    el.textContent = r.render || '（名字留空时人设不生效，生成层沿用默认人格）';
    st.textContent = '校验通过 · 尚未保存';
    st.style.color = 'var(--warn)';
  } else {
    el.textContent = '校验未通过：\n- ' + (r.errors || []).join('\n- ');
    st.textContent = '校验未通过';
    st.style.color = 'var(--danger)';
  }
  return r;
}

async function savePersona() {
  const card = personaFormCard();
  const pre = await previewPersona();
  if (!pre || !pre.ok) { toast('校验未通过，未保存'); return; }
  if (!confirm('保存为新版本？旧版会先归档到历史，可随时回滚。')) return;
  const r = await put('/api/persona', {
    confirm: 'PERSONA', actor: 'human', reason: '后台管理修改', card: card
  });
  if (r.ok) {
    toast('已保存为 v' + r.version + '，下一轮对话生效');
    renderPersona();
    // 陪伴通道常驻单例缓存了旧人设，必须丢弃重建，否则"后台改了人设、对话还是旧人格"
    try { await post('/api/live/reset', {}); } catch(e) { /* 重置失败不拦保存 */ }
  }
  else toast(r.error || '保存失败');
}

async function fillPersonaExample() {
  const r = await api('/api/persona/template?example=true');
  if (r.template) { fillPersonaForm(r.template); toast('已填入示例，改几个字就能保存'); previewPersona(); }
}
async function fillPersonaBlank() {
  const r = await api('/api/persona/template?example=false');
  if (r.template) { fillPersonaForm(r.template); toast('已填入中性骨架'); previewPersona(); }
}

async function loadPersonaHistory() {
  const h = await api('/api/persona/history?limit=10');
  const items = h.items || [];
  const rows = items.map(x =>
    '<tr><td>v' + esc(x.version) + '</td><td>' + esc(x.name || '（未命名）') +
    '</td><td>' + esc((x.updated_at || '').slice(0, 16)) + '</td><td>' + esc(x.updated_by || '') +
    '</td><td>' + esc(x.reason || '') + '</td><td>' + esc(x.checksum || '') +
    '</td><td><button class="act" onclick="rollbackPersona(' + Number(x.version) + ')">恢复此版</button></td></tr>'
  ).join('');
  const el = $('#personaHistory');
  if (!el) return;
  el.innerHTML = rows
    ? '<table><thead><tr><th>版本</th><th>名字</th><th>归档时间</th><th>操作人</th><th>说明</th><th>checksum</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>'
    : '<div class="hint">还没有历史版本。保存一次后，旧版会先归档到这里。</div>';
}

async function rollbackPersona(v) {
  if (!confirm('把 v' + v + ' 恢复为新的当前版本？当前人设会先归档，历史不会丢。')) return;
  const r = await post('/api/persona/rollback', {
    confirm: 'PERSONA', version: v, actor: 'human', reason: '后台回滚到 v' + v
  });
  if (r.ok) { toast('已恢复为 v' + r.version); renderPersona(); }
  else toast(r.error || '回滚失败');
}

// ---------------- 数据（导出 / 重置） ----------------

  const [o, h] = await Promise.all([api('/api/overview'), api('/api/health')]);
  $('#view').innerHTML = `
  <div class="kpi">
    ${kpiCard('事件', o.active_events, o.archived_events ? '归档 ' + o.archived_events : '无归档')}
    ${kpiCard('概念', o.concepts)}
    ${kpiCard('人物 / 关系', o.personas + ' / ' + o.relations)}
    ${kpiCard('数据库', Math.round((h.db_size || 0) / 1024) + ' KB', esc(h.db_path))}
  </div>

  <div class="card" style="margin-top:14px">
    <div class="k">备份</div>
    <div class="hint" style="margin:6px 0 12px">导出全部事件、碎片、人物、关系、概念与模型配置（向量已省略，可由文本重建）。</div>
    <button class="act primary" onclick="exportData()">导出 JSON</button>
  </div>

  <div class="card" style="margin-top:14px" id="rebuildCard">
    <div class="k">向量重建</div>
    <div class="hint" style="margin:6px 0 12px">换过嵌入模型后，用当前模型为全部 <b id="rbEvents">—</b> 条记忆重新计算向量，<b>保留所有记忆 / 人物 / 会话，不清库</b>。全程遇错即停并回滚，不会留下半重建状态。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="act primary" id="rbStart" onclick="startRebuild()">开始重建</button>
      <button class="act danger" id="rbCancel" onclick="cancelRebuild()" style="display:none">取消</button>
      <span class="hint" id="rbStatus"></span>
    </div>
    <div id="rbProgress" style="display:none">
      <div class="rb-bar"><div class="rb-fill" id="rbFill"></div></div>
      <div class="rb-meta"><span id="rbCount"></span><span id="rbEta"></span></div>
    </div>
    <div class="hint" id="rbResult" style="margin-top:8px"></div>
  </div>

  <div class="card" style="margin-top:14px;border-color:#4a2630">
    <div class="k" style="color:#ff9b9b">危险区</div>
    <div class="hint" style="margin:6px 0 12px">「清空数据」会清掉全部业务表：记忆、碎片、概念、人物、关系、目标、成长 / 漂移日志、自叙事、标签与别名，以及 v9~v11 新增的<b>会话轮次、陪伴心境、L2 采纳日志、再巩固版本链</b>、情绪与用量；自增计数也归零。新增机制表会自动纳入，不必手工维护清单。模型配置与账号保留，不可恢复。<br><b>L0 人设卡与固定身份宪法不会被清掉</b>：清库清的是经历，不是「我是谁 / 我怎么说话」；要改请去「人设」页。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="resetConfirm" placeholder="输入 RESET 确认" style="width:200px" autocomplete="off">
      <button class="act danger" onclick="resetAll()">清空数据</button>
      <button class="act" onclick="resetDerived()">只清派生数据</button>
    </div>
  </div>`;
  const rbE = $('#rbEvents'); if(rbE) rbE.textContent = o.active_events || 0;
  refreshRebuildState();
}

let rbTimer = null;
async function refreshRebuildState(){
  try{
    const s = await api('/api/embed/rebuild/status');
    paintRebuildState(s);
    if(s.running){
      if(rbTimer) clearInterval(rbTimer);
      rbTimer = setInterval(pollRebuild, 700);
    }
  }catch(e){}
}
async function pollRebuild(){
  try{ paintRebuildState(await api('/api/embed/rebuild/status')); }catch(e){ return; }
}
function paintRebuildState(s){
  const box=$('#rbProgress'), fill=$('#rbFill'), cnt=$('#rbCount'),
        eta=$('#rbEta'), st=$('#rbStatus'), res=$('#rbResult'),
        start=$('#rbStart'), cancelBtn=$('#rbCancel');
  if(!box) return;
  const running=!!s.running;
  if(start) start.style.display = running ? 'none' : '';
  if(cancelBtn) cancelBtn.style.display = running ? '' : 'none';
  if(running){
    box.style.display='';
    const pct = s.total ? Math.round(s.done*100/s.total) : 0;
    fill.className='rb-fill'; fill.style.width=pct+'%';
    if(cnt) cnt.textContent = `已处理 ${s.done} / ${s.total}（${pct}%）· 模型 ${s.model||'—'}`;
    if(eta) eta.textContent = s.elapsed_ms ? `已用 ${(s.elapsed_ms/1000).toFixed(1)}s` : '';
    if(st) st.textContent = s.phase==='writing' ? '写入中（事务提交）…' : '正在重新嵌入…';
    if(res) res.textContent='';
  }else{
    if(s.phase==='done'){
      box.style.display=''; fill.className='rb-fill done'; fill.style.width='100%';
      if(cnt) cnt.textContent=`完成：已重建 ${s.rebuilt} 条向量`;
      if(eta) eta.textContent=`用时 ${(s.elapsed_ms/1000).toFixed(1)}s`;
      if(st) st.textContent='';
      if(res) res.textContent='✓ 重建完成，记忆 / 人物 / 会话均未丢失。';
    }else if(s.phase==='error'){
      box.style.display=''; fill.className='rb-fill err';
      if(cnt) cnt.textContent=`已停止于 ${s.done} / ${s.total}`;
      if(eta) eta.textContent='';
      if(st) st.textContent='';
      if(res) res.textContent='✗ '+(s.error||'重建失败')+'。原向量未改动，请检查模型 / Key 后重试。';
    }else if(s.phase==='cancelled'){
      box.style.display=''; fill.className='rb-fill';
      if(cnt) cnt.textContent=`已取消（处理到 ${s.done} / ${s.total}）`;
      if(eta) eta.textContent='';
      if(st) st.textContent='';
      if(res) res.textContent='已取消，原向量未改动。';
    }else{
      box.style.display='none';
      if(st) st.textContent='';
      if(res) res.textContent='';
    }
  }
  if(rbTimer && !running){ clearInterval(rbTimer); rbTimer=null; }
}
async function startRebuild(){
  try{
    const r=await post('/api/embed/rebuild',{});
    if(!r.ok){ toast(r.message||'启动失败'); return; }
    toast('已开始重建');
    if(rbTimer) clearInterval(rbTimer);
    rbTimer=setInterval(pollRebuild,700);
    paintRebuildState(r.state);
  }catch(e){ toast('启动失败：'+(e.message||e)); }
}
async function cancelRebuild(){
  try{
    const r=await post('/api/embed/rebuild/cancel',{});
    toast(r.message||'已请求取消');
    paintRebuildState(r.state);
  }catch(e){ toast('取消失败'); }
}

async function exportData(){
  const d = await api('/api/export');
  const blob = new Blob([JSON.stringify(d, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'neuromem-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已导出');
}

async function resetAll(){
  const el = $('#resetConfirm');
  const v = el ? el.value.trim() : '';
  if(v !== 'RESET'){ toast('请输入 RESET 确认'); return; }
  if(!confirm('确定清空全部数据？不可恢复。')) return;
  const r = await post('/api/reset', {confirm: 'RESET'});
  if(r.ok){
    const n = Object.keys(r.counts || {}).length;
    const hit = ['adoption_log','conversation_turns','memory_versions','companion_state']
      .filter(t => (r.cleared || []).includes(t)).length;
    toast('已清空 ' + n + ' 张表（含 ' + hit + '/4 张新机制表）');
    await loadOverview();
    switchTab('overview');
  }else{
    toast(r.error || '清空失败');
  }
}

async function resetDerived(){
  if(!confirm('清空派生数据（目标、漂移日志、自我叙事）？记忆本身保留，不可恢复。')) return;
  const r = await post('/api/reset', {confirm: 'RESET', scope: 'derived'});
  toast(r.ok ? '已清理派生数据' : (r.error || '失败'));
  if(r.ok){ await loadOverview(); switchTab('data'); }
}

async function switchTab(tab){
  if(tab!=='chat') stopProactivePolling();
  const m = PAGE_META[tab] || [tab, ''];
  const t = $('#pageTitle'); if(t) t.textContent = m[0];
  const s = $('#pageSub'); if(s) s.textContent = m[1];
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  if(tab==='overview'){ renderOverview(); return; }
  if(tab==='graph'){ renderGraph(); return; }
  if(tab==='growth'){ renderGrowth(); return; }
  if(tab==='chat'){ $('#view').innerHTML = renderChat(); startProactivePolling(); refreshLiveStatus(); return; }
  if(tab==='models'){ renderModels(); return; }
  if(tab==='persona'){ renderPersona(); return; }
  if(tab==='data'){ renderData(); return; }
  if(tab==='support'){ renderSupport(); return; }
  if(tab==='events'){
    const [rows, ps] = await Promise.all([api('/api/events' + evQuery()), api('/api/personas')]);
    $('#view').innerHTML = renderEvents(rows, ps);
    syncFilterUI();
    return;
  }
  if(tab==='concepts'){ renderConceptsTab(); return; }
  if(tab==='relations'){
    const [rows, ps] = await Promise.all([api('/api/relations'), api('/api/personas')]);
    $('#view').innerHTML = renderRelations(rows, ps);
    return;
  }
  let html='';
  if(tab==='personas') html = renderPersonas(await api('/api/personas'));
  $('#view').innerHTML = html;
}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target && e.target.id==='askInput' && !e.shiftKey){ e.preventDefault(); doAsk(); }
  if(e.key==='Enter' && e.ctrlKey && e.target && e.target.id==='newText'){ e.preventDefault(); addMemory(); }
});
(async () => {
  const ok = await checkAuth();
  if(!ok) return;
  loadOverview();
  // 桌面端深链：/desk-web-login 跳来时带 ?tab=events，直接落到指定页
  let tab = 'overview';
  try {
    const q = new URLSearchParams(location.search).get('tab');
    if(q && PAGE_META[q]) tab = q;
  } catch(e) {}
  switchTab(tab);
})();
window.addEventListener('resize',()=>{
  graphChart&&graphChart.resize(); growthChart&&growthChart.resize();
  emoChart&&emoChart.resize(); modelsChart&&modelsChart.resize();
});
