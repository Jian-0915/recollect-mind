<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿澈 · 对话</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem("ache.theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;

      var l = new URLSearchParams(location.search).get("layout") || localStorage.getItem("ache.layout");
      if (["air", "letter", "quiet"].indexOf(l) < 0) l = "air";
      document.documentElement.dataset.layout = l;
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/ui.css">
<link rel="stylesheet" href="assets/pages.css">
<link rel="stylesheet" href="assets/layouts.css">
</head>
<body class="app app--chat">
<div class="ambient" aria-hidden="true"></div>

<h1 class="sr-only">与阿澈的对话</h1>

<!-- ==================== 顶栏 ==================== -->
<header class="topbar">
  <a class="identity" href="settings.html" aria-label="阿澈 · 打开人设设置">
    <span class="seal" aria-hidden="true">澈</span>
    <span class="identity__text">
      <span class="identity__name">阿澈</span>
      <span class="status" id="status" data-state="online">
        <span class="status__dot" aria-hidden="true"></span>
        <span id="statusLabel">在</span>
      </span>
    </span>
  </a>

  <div class="topbar__actions">
    <div class="menu-wrap">
      <button class="icon-btn" id="menuBtn" type="button" aria-haspopup="menu"
              aria-expanded="false" aria-controls="appMenu" aria-label="更多">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5.5" cy="12" r="1.7"></circle>
          <circle cx="12" cy="12" r="1.7"></circle>
          <circle cx="18.5" cy="12" r="1.7"></circle>
        </svg>
      </button>
      <div class="menu" id="appMenu" role="menu" aria-label="更多" hidden>
        <div class="menu__label" role="presentation">版式</div>
        <button class="menu__item" type="button" role="menuitemradio"
                data-layout-option="air" aria-checked="true">
          <span>舒展</span>
          <span class="menu__check" aria-hidden="true">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          </span>
        </button>
        <button class="menu__item" type="button" role="menuitemradio"
                data-layout-option="letter" aria-checked="false">
          <span>信件</span>
          <span class="menu__check" aria-hidden="true">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          </span>
        </button>
        <button class="menu__item" type="button" role="menuitemradio"
                data-layout-option="quiet" aria-checked="false">
          <span>极简</span>
          <span class="menu__check" aria-hidden="true">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          </span>
        </button>

        <div class="menu__sep" role="separator"></div>
        <button class="menu__item" id="themeItem" type="button" role="menuitemcheckbox" aria-checked="false">
          <span>暖夜模式</span>
          <span class="menu__check" aria-hidden="true">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          </span>
        </button>

        <div class="menu__sep" role="separator"></div>
        <button class="menu__item" id="memoryItem" type="button" role="menuitem">
          <span>查看记忆</span>
          <span class="menu__tag">后台</span>
        </button>

        <div class="menu__sep" role="separator"></div>
        <button class="menu__item menu__item--compact" type="button" role="menuitem" disabled>
          <span>陪我听歌</span><span class="menu__tag">规划中</span>
        </button>
        <button class="menu__item menu__item--compact" type="button" role="menuitem" disabled>
          <span>帮我操作电脑</span><span class="menu__tag">规划中</span>
        </button>
      </div>
    </div>
    <a class="icon-btn" href="settings.html" aria-label="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 0 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 0 1 0-4h.11a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 0 1 4 0v.11a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 0 1 0 4h-.11a1.7 1.7 0 0 0-1.56 1z"></path>
      </svg>
    </a>
  </div>
</header>

<!-- ==================== 消息流 ==================== -->
<main class="chat" id="chat" tabindex="0" aria-label="对话记录">
  <div class="chat__inner" id="stream" role="log" aria-live="polite" aria-label="对话消息">

    <!-- 空状态：没有历史时显示 -->
    <section class="empty" id="empty" aria-labelledby="emptyTitle">
      <div class="empty__mark" aria-hidden="true"><span class="seal seal--lg">澈</span></div>
      <h2 class="empty__title" id="emptyTitle">跟阿澈说句话吧</h2>
      <p class="empty__hint">它记得你提过的事，<br>也会记得你今天累不累。</p>
      <div class="suggestions">
        <button class="suggestion" type="button" data-say="今天有点累">今天有点累</button>
        <button class="suggestion" type="button" data-say="帮我理一下明天的安排">帮我理一下明天的安排</button>
        <button class="suggestion" type="button" data-say="就想随便聊聊">就想随便聊聊</button>
      </div>
    </section>

    <!-- ⑤ 在想…（发送或点击演示时出现） -->
    <div class="thinking" id="thinking" hidden>
      <span class="seal seal--xs" aria-hidden="true">澈</span>
      <span class="thinking__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>在想…</span>
    </div>

  </div>
</main>

<!-- ==================== 输入区 ==================== -->
<form class="composer" id="composer" autocomplete="off">
  <div class="composer__inner">
    <div class="send-error" id="sendError" role="alert" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4l9 16H3L12 4z"></path><path d="M12 10v4"></path><path d="M12 17.2v.3"></path>
      </svg>
      <span>没发出去，阿澈没收到。</span>
      <button class="linkish" type="button" id="retrySend">重发</button>
    </div>
    <div class="composer__field">
      <label class="sr-only" for="input">对阿澈说</label>
      <textarea class="composer__input" id="input" rows="1" maxlength="2000"
                placeholder="跟阿澈说点什么…" enterkeyhint="send"
                aria-describedby="composerHelp"></textarea>
      <button class="send" id="send" type="submit" aria-label="发送" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path>
        </svg>
      </button>
    </div>
    <div class="composer__meta">
      <span class="composer__hint" id="composerHelp">Enter 发送 · Shift + Enter 换行</span>
    </div>
  </div>
</form>

<!-- ==================== 主动关心浮层（角落小卡） ==================== -->
<aside class="popup" id="proactivePopup" role="dialog" aria-labelledby="ppName" hidden>
  <div class="popup__head">
    <span class="seal seal--xs" aria-hidden="true">澈</span>
    <span class="popup__name" id="ppName">阿澈</span>
    <span class="popup__time">刚刚</span>
    <button class="popup__close" type="button" id="ppClose" aria-label="收起这张卡片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
  <p class="popup__text">刚看到你把周四的评审挪到下午了。空出来的那一段，别又填满。</p>
  <div class="popup__actions">
    <button class="btn btn--ghost btn--sm" type="button" data-pp="later">先不用</button>
    <button class="btn btn--primary btn--sm" type="button" data-pp="reply">回应</button>
  </div>
</aside>

<div class="toast-wrap">
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
    <span id="toastText"></span>
  </div>
</div>

<script src="logic.js"></script>
<script src="assets/app.js" defer></script>
</body>
</html>
